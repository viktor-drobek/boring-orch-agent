name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate-build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify tag and package version
        run: python tools/version.py check "$GITHUB_REF_NAME"
      - name: Run the behavior-first pipeline
        run: python tools/pipeline.py
      - name: Create GitHub release with verified distributions
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/verified/*.tar.gz
            dist/verified/*.whl
