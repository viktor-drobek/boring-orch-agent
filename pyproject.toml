[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boring-orch-agent"
version = "0.1.4"
description = "A durable local manager-worker orchestrator for agent tasks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.19.2,<5", "referencing>=0.28.4"]

[project.optional-dependencies]
dev = ["behave==1.3.3", "build==1.3.0", "setuptools>=77", "wheel>=0.43"]

[project.scripts]
boring-orch-agent = "boring_agent.cli:main"
boa = "boring_agent.cli:main"

[tool.setuptools.packages.find]
include = ["boring_agent*"]
