[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boring-agent"
version = "0.3.0"
description = "A durable local manager-worker orchestrator for agent tasks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = ["jsonschema>=4.19.2,<5", "referencing>=0.28.4"]

[project.optional-dependencies]
dev = ["behave==1.3.3", "build==1.3.0", "setuptools>=77", "wheel>=0.43", "PyYAML>=6,<7"]

[project.scripts]
boring-agent = "boring_agent.cli:main"
boring-orch-agent = "boring_agent.cli:main"
boa = "boring_agent.cli:main"

[tool.setuptools.packages.find]
include = ["boring_agent*"]

[tool.setuptools.data-files]
"." = ["AGENTS.md", "CLAUDE.md", "SKILL.md"]
".coddy/agents" = [".coddy/agents/*.md"]
".coddy/rules" = [".coddy/rules/*.md"]
".codex" = [".codex/*.json", ".codex/*.md"]
".codex/hooks" = [".codex/hooks/*.py"]
".codex-plugin" = [".codex-plugin/*.json"]
".claude/rules" = [".claude/rules/*.md"]
".claude/agents" = [".claude/agents/*.md"]
".claude-plugin" = [".claude-plugin/*.json"]
".cursor/rules" = [".cursor/rules/*.mdc"]
".cursor-plugin" = [".cursor-plugin/*.json"]
"docs" = ["docs/*.md"]
"examples" = ["examples/*.json"]
"examples/api" = ["examples/api/*.json"]
"examples/coddy" = ["examples/coddy/*.json", "examples/coddy/*.md"]
"examples/jobs" = ["examples/jobs/*.json", "examples/jobs/*.md"]
"features" = ["features/*.feature", "features/*.py"]
"features/steps" = ["features/steps/*.py"]
"tools" = ["tools/*.py"]
